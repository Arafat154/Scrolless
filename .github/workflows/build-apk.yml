name: Build APK

# Builds an installable debug APK. No signing secrets are needed.
# Runs automatically when this branch is pushed, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - android-tv
      - device-admin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/gradle-ci.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scrolless-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
